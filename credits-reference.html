<style>
/* =====================================================================
   THEME HOOKS — the ONLY colours/fonts this screen uses.
   Map every --cr-* variable to the app's existing theme tokens so the
   screen follows whichever palette is active. Values below are just
   preview fallbacks; do not ship them as hardcoded colours.
   ===================================================================== */
:root{
  --cr-bg:#14080F;               /* app background */
  --cr-wall-1:rgba(255,138,76,.50); /* background glow blobs (use theme accent tints, or transparent for flat themes) */
  --cr-wall-2:rgba(236,72,153,.40);
  --cr-wall-3:rgba(124,58,237,.42);
  --cr-text-1:#FFF6F0;           /* primary text */
  --cr-text-2:#F0D2CE;           /* secondary text */
  --cr-text-3:#CCA8AC;           /* tertiary / labels */
  --cr-accent-a:#FFB86B;         /* brand accent 1 */
  --cr-accent-b:#FF5E9C;         /* brand accent 2 */
  --cr-accent-c:#A78BFA;         /* brand accent 3 (can equal accent-a) */
  --cr-on-accent:#2A0A14;        /* text/icon on accent fills */
  --cr-surface:rgba(255,255,255,.08);   /* card / glass surface */
  --cr-border:rgba(255,255,255,.16);    /* card edge */
  --cr-highlight:rgba(255,255,255,.28); /* top inner highlight (transparent for flat themes) */
  --cr-glow:rgba(255,110,140,.55);      /* coloured shadow / glow */
  --cr-card-1:#3A1B2E;           /* Jack card face, light → dark */
  --cr-card-2:#22101C;
  --cr-card-3:#170A13;
  --cr-suit-red:#FFA6B4;         /* red suit colour */
  --cr-font-body:'Instrument Sans',system-ui,sans-serif;
  --cr-font-display:'Instrument Serif',Georgia,serif;
  --cr-font-mono:'Space Mono',ui-monospace,monospace;
}
@property --ang{syntax:'<angle>';initial-value:0deg;inherits:false}
body{margin:0;background:#000;display:flex;justify-content:center}
a{color:var(--cr-accent-a)}

.cr{position:relative;overflow:hidden;width:100%;max-width:420px;min-height:100vh;box-sizing:border-box;color:var(--cr-text-1);font-family:var(--cr-font-body);
  background:radial-gradient(70% 26% at 10% 4%,var(--cr-wall-1) 0,transparent 72%),radial-gradient(70% 22% at 100% 30%,var(--cr-wall-2) 0,transparent 72%),radial-gradient(90% 26% at 10% 64%,var(--cr-wall-3) 0,transparent 72%),var(--cr-bg)}
.gl{background:var(--cr-surface);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);box-shadow:inset 0 1px 0 var(--cr-highlight),inset 0 0 0 1px var(--cr-border),0 10px 24px -10px rgba(0,0,0,.45)}

/* header */
.hdr{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:12px 16px 0;position:relative;z-index:2}
.ib{width:44px;height:44px;border-radius:50%;border:0;color:var(--cr-text-1);display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:22px;height:22px;fill:currentColor}
.hdr b{text-align:center;font-size:16px;font-weight:700;letter-spacing:-.01em}

/* floating suits + sparkles */
.fs{position:absolute;fill:var(--cr-text-1);opacity:.1;animation:drift 9s ease-in-out infinite;pointer-events:none}
@keyframes drift{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-18px) rotate(calc(var(--r) + 14deg))}}
.sp{position:absolute;width:14px;height:14px;fill:var(--cr-accent-a);animation:tw 2.6s ease-in-out infinite;animation-delay:var(--d)}
@keyframes tw{0%,100%{transform:scale(.2) rotate(0);opacity:0}45%{transform:scale(1) rotate(45deg);opacity:1}70%{opacity:.6}}

/* Jack card */
.stage{position:relative;height:280px;display:grid;place-items:center;perspective:700px;margin-top:4px}
.halo{position:absolute;width:220px;height:220px;border-radius:50%;background:conic-gradient(from var(--ang),var(--cr-accent-a),var(--cr-accent-b),var(--cr-accent-c),var(--cr-accent-a));filter:blur(46px);opacity:.55;animation:ang 6s linear infinite}
.card{position:relative;width:164px;height:230px;border-radius:18px;transform-style:preserve-3d;animation:flt 7s ease-in-out infinite;
  background:radial-gradient(120% 90% at 25% 10%,var(--cr-card-1) 0,var(--cr-card-2) 55%,var(--cr-card-3) 100%);box-shadow:0 30px 60px -18px var(--cr-glow),inset 0 1px 0 var(--cr-highlight)}
@keyframes flt{0%,100%{transform:rotateY(-16deg) rotateX(8deg) translateY(0)}50%{transform:rotateY(14deg) rotateX(-4deg) translateY(-10px)}}
.card::before{content:"";position:absolute;inset:-2px;border-radius:20px;padding:2px;background:conic-gradient(from var(--ang),var(--cr-accent-a),var(--cr-accent-b),var(--cr-accent-c),var(--cr-accent-a));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ang 4s linear infinite}
@keyframes ang{to{--ang:360deg}}
.sheen{position:absolute;inset:0;border-radius:18px;overflow:hidden;pointer-events:none}
.sheen::after{content:"";position:absolute;top:-40%;left:-80%;width:60%;height:180%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:rotate(14deg);animation:swp 4.5s ease-in-out infinite}
@keyframes swp{0%,40%{left:-80%}75%,100%{left:140%}}
.pip{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 22px/1 var(--cr-font-body);color:var(--cr-accent-a)}
.pip svg{width:16px;height:16px;fill:var(--cr-accent-b)}
.pip.tl{left:12px;top:12px}.pip.br{right:12px;bottom:12px;transform:rotate(180deg)}
.bigJ{position:absolute;inset:0;display:grid;place-items:center;font:italic 400 130px/1 var(--cr-font-display);background:linear-gradient(160deg,var(--cr-accent-a) 20%,var(--cr-accent-b) 65%,var(--cr-accent-c));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px var(--cr-glow))}
.mono{position:absolute;left:0;right:0;bottom:30px;text-align:center;font:700 10px/1 var(--cr-font-mono);letter-spacing:.28em;color:var(--cr-text-3)}

/* name */
.who{text-align:center;padding:0 20px;position:relative;z-index:1}
.kick{margin:0;font:700 11px/16px var(--cr-font-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--cr-text-2)}
.nm{position:relative;display:inline-block;margin:6px 0 14px;font:italic 400 58px/1 var(--cr-font-display);letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1.2px var(--cr-text-1)}
.nm::before{content:attr(data-t);position:absolute;inset:0;-webkit-text-stroke:0;background:linear-gradient(90deg,var(--cr-accent-a),var(--cr-accent-b),var(--cr-accent-c),var(--cr-accent-a));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;clip-path:inset(0 100% 0 0);animation:fill 1.6s cubic-bezier(.65,0,.35,1) .5s forwards,hue 6s linear 2.1s infinite}
@keyframes fill{to{clip-path:inset(0 0 0 0)}}
@keyframes hue{to{background-position:300% 0}}
.links{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.handle{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 18px 0 6px;border-radius:22px;text-decoration:none;color:var(--cr-text-1);font-weight:600;font-size:14px}
.handle i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--cr-font-mono);font-style:normal;color:var(--cr-on-accent);background:linear-gradient(135deg,var(--cr-accent-a),var(--cr-accent-b))}
.handle i svg{width:16px;height:16px;fill:var(--cr-on-accent)}

/* crew */
.sec{padding:30px 20px 0;display:flex;flex-direction:column;gap:12px}
.box{border-radius:22px;padding:6px;animation:rise .7s cubic-bezier(.22,1,.36,1) backwards;animation-delay:var(--d)}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.lbl{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;font:700 11px/16px var(--cr-font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--cr-text-2)}
.lbl svg{width:16px;height:16px;fill:var(--cr-accent-a)}
.row{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px}
.row+.row{border-top:1px solid var(--cr-border)}
.av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--cr-on-accent);background:linear-gradient(135deg,var(--cr-accent-a),var(--cr-accent-b))}
.av.alt{background:linear-gradient(135deg,var(--cr-accent-b),var(--cr-accent-c))}
.nmb{flex:1;min-width:0;font-size:16px;line-height:21px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ig{flex:none;height:36px;padding:0 12px;border-radius:18px;display:inline-flex;align-items:center;gap:4px;font:700 12px var(--cr-font-mono);text-decoration:none;color:var(--cr-text-1)}
.ig em{font-style:normal;color:var(--cr-accent-a)}
.pills{display:flex;flex-wrap:wrap;gap:8px;padding:6px 10px 12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;font-size:14px;font-weight:600;background:var(--cr-surface);box-shadow:inset 0 0 0 1px var(--cr-border);animation:pop .5s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:calc(2.7s + var(--i)*.08s)}
.pill svg{width:12px;height:12px;fill:var(--cr-suit-red)}
@keyframes pop{from{transform:scale(0);opacity:0}}

/* footer */
.ft{text-align:center;padding:40px 20px 36px}
.ft .big{margin:0;font:italic 400 40px/1 var(--cr-font-display);background:linear-gradient(90deg,var(--cr-text-1),var(--cr-accent-a),var(--cr-accent-b));-webkit-background-clip:text;background-clip:text;color:transparent}
.suits{display:flex;justify-content:center;gap:14px;margin:18px 0 14px}
.suits svg{width:18px;height:18px;animation:bob 1.8s ease-in-out infinite;animation-delay:calc(var(--i)*.15s)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ver{margin:0;font:700 11px/16px var(--cr-font-mono);letter-spacing:.16em;color:var(--cr-text-3)}

@media (prefers-reduced-motion:reduce){.cr *,.cr *::before,.cr *::after{animation:none!important}.nm::before{clip-path:none}}
</style>
