<div class="app">
  <div class="hdr">
    <button class="ibtn" aria-label="Back"><svg class="ic24 ic"><use href="#i-back"/></svg></button>
    <span></span><span></span>
  </div>
  <div class="pg" style="gap:32px;padding-bottom:104px">
    <h1 class="title" style="margin-top:-8px">Decks and players</h1>
    <section style="display:flex;flex-direction:column;gap:8px">
      <div class="sec">Decks</div>
      <div class="seg" style="--n:2;--i:0"><button class="on">1 deck</button><button>2 decks</button></div>
    </section>
    <section style="display:flex;flex-direction:column;gap:8px">

      </div>
    </section>
    <section style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="sec">Dealing direction</div>
        <div class="seg" style="--n:2;--i:0"><button class="on"><svg class="ic"><use href="#i-cw"/></svg>Clockwise</button><button><svg class="ic"><use href="#i-ccw"/></svg>Anticlockwise</button></div>

      <p class="small t2">Up to 10 cards · 3 → 10 → 3, repeating</p>
    </section>
    <div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center">
      <div class="tbl" style="--rx:118px;--ry:78px;--frx:92px;--fry:52px;--s:36px;width:320px;height:200px">

        <div class="seat" style="--a:342deg"><span class="av empty">5</span></div>
      </div>
    </div>
  </div>
  <div class="bar"><button class="btn p">Next</button></div>
</div>
