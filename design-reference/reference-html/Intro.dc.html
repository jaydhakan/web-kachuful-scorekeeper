<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round intro</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./kf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..700,0..100,0..1&family=Instrument+Sans:wght@400..700&display=swap">
<style>body{margin:0}</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="s-spade" viewBox="0 0 24 24"><path d="M12 2C9.5 6 3 9.2 3 14.2A4.4 4.4 0 0 0 11 16.8C10.9 19 10.2 20.6 8.6 22H15.4C13.8 20.6 13.1 19 13 16.8A4.4 4.4 0 0 0 21 14.2C21 9.2 14.5 6 12 2Z"/></symbol>
</svg>
<div class="app">
  <div class="pg" style="align-items:center;padding-top:64px">
    <h1 class="display" style="font-size:34px">Round 1</h1>
    <div class="card" style="width:132px;margin-top:24px" role="img" aria-label="Spades, trump card">
      <svg class="ix su s"><use href="#s-spade"/></svg>
      <div class="mid"><svg class="su s"><use href="#s-spade"/></svg></div>
      <svg class="ix br su s"><use href="#s-spade"/></svg>
    </div>
    <p class="t2" style="margin-top:20px;display:flex;align-items:center;gap:8px"><svg class="su s" style="width:18px;height:18px"><use href="#s-spade"/></svg>Spades are trump</p>
    <div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%">
      <div class="tbl" style="--rx:112px;--ry:52px;--s:36px;width:320px;height:190px">
        <div class="felt"></div>
        <div class="seat" style="--a:270deg"><span class="av c1">🦁</span><span class="cb" style="--a:270deg"></span><span class="nm">Aarav</span></div>
        <div class="seat" style="--a:198deg"><span class="av c2">🐯</span><span class="cb" style="--a:198deg"></span><span class="nm">Riya</span></div>
        <div class="seat" style="--a:126deg"><span class="av c3">🦊</span><span class="cb" style="--a:126deg"></span><span class="nm">Kabir</span></div>
        <div class="seat" style="--a:54deg"><span class="av c4">🐼</span><span class="cb" style="--a:54deg"></span><span class="nm">Meera</span></div>
        <div class="seat" style="--a:342deg"><span class="av c5">🐸</span><span class="cb" style="--a:342deg"></span><span class="nm">Dev</span></div>
      </div>
    </div>
    <button class="gtxt" style="margin-bottom:24px;color:var(--text-3)"><span class="cap">Tap to skip</span></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
