<div class="app">
  <div class="hdr">
    <button class="ibtn" aria-label="Back"><svg class="ic24 ic"><use href="#i-back"/></svg></button>
    <div class="t"><b>Seat the table</b><span>Step 2 of 3</span></div>
    <span></span>
  </div>
  <div class="pg" style="padding-bottom:104px">
    <div style="flex:1;min-height:0;display:flex;align-items:center;justify-content:center">
      <div class="tbl" style="--rx:104px;--ry:70px;--s:56px;--nf:14px;width:320px;height:240px">
        <div class="felt"></div>
        <div class="ctr"><svg class="ic t3"><use href="#i-cw"/></svg><span class="tn">3 of 5 seated</span></div>
        <div class="seat" style="--a:270deg"><span class="av c1">🦁</span><span class="nm">Aarav</span></div>
        <div class="seat" style="--a:198deg"><span class="av c2">🐯</span><span class="nm">Riya</span></div>
        <div class="seat" style="--a:126deg"><span class="av c3">🦊</span><span class="nm">Kabir</span></div>
        <div class="seat" style="--a:54deg"><span class="av empty live">4</span></div>
        <div class="seat" style="--a:342deg"><span class="av empty">5</span></div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px">
      <h2 class="heading">Who sits left of Kabir?</h2>
      <div class="addrow">
        <input class="inp f" placeholder="Type a name" aria-label="Player name">
        <button class="btn p" aria-label="Add player"><svg class="ic24 ic"><use href="#i-plus"/></svg></button>
      </div>
      <div class="hs fade-r" style="margin:0 -20px;padding:2px 20px 2px 2px;padding-left:22px" role="list" aria-label="Remembered names">
        <button class="nchip" role="listitem">Meera</button><button class="nchip" role="listitem">Dev</button><button class="nchip" role="listitem">Ishaan</button><button class="nchip" role="listitem">Naina</button><button class="nchip" role="listitem">Tara</button>
      </div>
      <p class="small t3">Names you add are remembered for next time.</p>
    </div>
  </div>
  <div class="bar"><button class="btn p dis" disabled>Next</button></div>
</div>
