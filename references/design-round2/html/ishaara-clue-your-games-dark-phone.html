<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Ishaara clue-giver: your games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Cinzel:wght@600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Mono:wght@400;700&family=DM+Mono:wght@400;500&display=swap">
<style>/* Baithak — theme tokens + components (round 2).
   Themes change colour, type, radius and shadow only. Sizes, borders and positions are identical in every theme.
   NEW = added for the platform or the new games. */

.theme-sunset, .theme-emerald, .theme-yerba, .theme-paper {
  --text-xs: 13px; --text-sm: 15px; --text-md: 17px; --text-lg: 20px; --text-xl: 24px;
  --text-2xl: 30px; --text-3xl: 40px; --text-4xl: 56px; --text-5xl: 72px;
  --tap-min: 48px; --border-w: 1px;
  --motion-enter: 320ms; --motion-exit: 240ms; --motion-reduced: 150ms;
  --motion-ease-out: cubic-bezier(.2,.8,.2,1); --motion-ease-in: cubic-bezier(.4,0,.9,.5);
  --team-sun: #f5a524; --team-sun-ink: #2a1600;
  --card-trap: #0b0b10; --card-trap-ink: #f6efe3;
  --positive: #1f8a55; --negative: #c43a3a;
  --clue-bg: #0e0e10; --clue-surface: #1a1a1e; --clue-border: #2c2c32; --clue-text: #e9e6e1; --clue-muted: #a19d97;
}

/* ---------------- Sunset Glass ---------------- */
.theme-sunset {
  --page-bg: radial-gradient(90% 50% at 0% 0%, rgba(138,64,41,.8) 0%, rgba(138,64,41,0) 70%), radial-gradient(80% 45% at 100% 35%, rgba(123,36,86,.6) 0%, rgba(123,36,86,0) 70%), radial-gradient(70% 40% at 20% 100%, rgba(70,30,110,.45) 0%, rgba(70,30,110,0) 70%), #160d14;
  --color-bg: #160d14; --color-surface: rgba(255,236,242,.07); --color-surface-strong: #241520; --color-border: rgba(255,226,236,.18);
  --color-text: #fbf0ea; --color-text-muted: #cdb8be; --color-label: #f2b56b; --color-gold: #e6c36a; --color-focus: #ffd59a;
  --cta-bg: linear-gradient(90deg,#ffb27a,#f2679a); --cta-text: #2a0e16;
  --control-bg: rgba(255,236,242,.08); --control-on-bg: #fbf0ea; --control-on-text: #2a0e16;
  --shadow-card: 0 12px 32px rgba(0,0,0,.32); --shadow-outline: 0 0 0 0 transparent;
  --radius-card: 28px; --radius-control: 999px; --radius-tile: 18px; --radius-key: 16px;
  --font-display: 'Instrument Sans', system-ui, sans-serif; --display-weight: 700; --display-style: normal; --display-tracking: -0.03em; --display-transform: none;
  --font-body: 'Instrument Sans', system-ui, sans-serif; --body-weight-strong: 700;
  --font-num: 'Instrument Sans', system-ui, sans-serif; --num-weight: 700; --num-style: normal;
  --font-label: 'Instrument Sans', system-ui, sans-serif; --label-weight: 700; --label-tracking: .14em;
  --positive: #7fe0a8; --negative: #ff8a9a;
  /* NEW */
  --brand-seat: #fbefe5; --brand-seat-active: #e9c46a;
  --table-felt: #c8508a; --table-felt-2: #6d1c4a; --table-rim: rgba(255,214,230,.35);
  --seat-ring: rgba(255,226,236,.35); --seat-active: #ffb27a;
  --badge-soon-bg: rgba(255,236,242,.10); --badge-soon-text: #f4ddd0; --badge-soon-border: rgba(255,226,236,.34);
  --status-offline-bg: #3a2614; --status-offline-text: #ffd89a; --status-live: #7fe0a8;
  --scrim: rgba(10,4,8,.62); --sheet-bg: #22141d;
  --team-moon: #4f5bd5; --team-moon-ink: #fbf6ec;
  --card-word: #f6efe3; --card-word-ink: #1d1a17; --card-blank: #6e6a86; --card-blank-ink: #ffffff; --card-edge: transparent;
  --side-bid: #e9c46a; --side-bid-ink: #2a1a05;
  --select-ring: #ffd59a;
}

/* ---------------- Emerald Gilt ---------------- */
.theme-emerald {
  --page-bg: radial-gradient(90% 50% at 50% 0%, rgba(40,96,68,.75) 0%, rgba(40,96,68,0) 70%), radial-gradient(60% 40% at 100% 100%, rgba(120,92,30,.35) 0%, rgba(120,92,30,0) 70%), #0c1f17;
  --color-bg: #0c1f17; --color-surface: rgba(20,58,42,.78); --color-surface-strong: #12301f; --color-border: rgba(217,180,90,.45);
  --color-text: #f4ecd6; --color-text-muted: #bcc6b2; --color-label: #e0bf6a; --color-gold: #d9b45a; --color-focus: #f4dc94;
  --cta-bg: linear-gradient(180deg,#ecc977,#c79a3c); --cta-text: #1b1405;
  --control-bg: rgba(217,180,90,.10); --control-on-bg: #d9b45a; --control-on-text: #1b1405;
  --shadow-card: 0 10px 28px rgba(0,0,0,.35); --shadow-outline: 0 0 0 0 transparent;
  --radius-card: 16px; --radius-control: 12px; --radius-tile: 12px; --radius-key: 12px;
  --font-display: 'Cinzel', Georgia, serif; --display-weight: 700; --display-style: normal; --display-tracking: .02em; --display-transform: uppercase;
  --font-body: 'Instrument Sans', system-ui, sans-serif; --body-weight-strong: 700;
  --font-num: 'Instrument Sans', system-ui, sans-serif; --num-weight: 700; --num-style: normal;
  --font-label: 'Cinzel', Georgia, serif; --label-weight: 700; --label-tracking: .12em;
  --positive: #8fe0ae; --negative: #ff9a8a;
  /* NEW */
  --brand-seat: #f3ead2; --brand-seat-active: #d9b45a;
  --table-felt: #2a6a4c; --table-felt-2: #0f3324; --table-rim: #c9a24a;
  --seat-ring: rgba(217,180,90,.6); --seat-active: #ecc977;
  --badge-soon-bg: rgba(217,180,90,.14); --badge-soon-text: #ecd9a6; --badge-soon-border: rgba(217,180,90,.55);
  --status-offline-bg: #2d2a12; --status-offline-text: #f1d68a; --status-live: #8fe0ae;
  --scrim: rgba(3,12,8,.62); --sheet-bg: #102a1e;
  --team-moon: #4f5bd5; --team-moon-ink: #fbf6ec;
  --card-word: #f6efe3; --card-word-ink: #1a1a12; --card-blank: #5b6a5e; --card-blank-ink: #ffffff; --card-edge: rgba(217,180,90,.6);
  --side-bid: #d9b45a; --side-bid-ink: #1b1405;
  --select-ring: #f4dc94;
}

/* ---------------- Yerba Sun ---------------- */
.theme-yerba {
  --page-bg: #fbe4b3;
  --color-bg: #fbe4b3; --color-surface: #fff6e2; --color-surface-strong: #fff1d2; --color-border: #2b1608;
  --color-text: #2b1608; --color-text-muted: #6b4a2e; --color-label: #b23d24; --color-gold: #b23d24; --color-focus: #2b1608;
  --cta-bg: #ec6a4f; --cta-text: #2b1608;
  --control-bg: #fff6e2; --control-on-bg: #2b1608; --control-on-text: #fff6e2;
  --shadow-card: 4px 4px 0 #2b1608; --shadow-outline: 0 0 0 2px #2b1608;
  --radius-card: 22px; --radius-control: 16px; --radius-tile: 14px; --radius-key: 14px;
  --font-display: 'Bricolage Grotesque', 'Arial Black', sans-serif; --display-weight: 800; --display-style: normal; --display-tracking: -0.03em; --display-transform: none;
  --font-body: 'Bricolage Grotesque', system-ui, sans-serif; --body-weight-strong: 700;
  --font-num: 'Bricolage Grotesque', system-ui, sans-serif; --num-weight: 800; --num-style: normal;
  --font-label: 'Space Mono', ui-monospace, monospace; --label-weight: 700; --label-tracking: .1em;
  --positive: #1f7a4a; --negative: #b3261e;
  /* NEW */
  --brand-seat: #2b1608; --brand-seat-active: #c8462c;
  --table-felt: #ef7a5f; --table-felt-2: #e0563b; --table-rim: #2b1608;
  --seat-ring: #2b1608; --seat-active: #2b1608;
  --badge-soon-bg: #fbe4b3; --badge-soon-text: #2b1608; --badge-soon-border: #2b1608;
  --status-offline-bg: #2b1608; --status-offline-text: #fff1d2; --status-live: #1f7a4a;
  --scrim: rgba(43,22,8,.5); --sheet-bg: #fff6e2;
  --team-moon: #3f4bc4; --team-moon-ink: #ffffff;
  --card-word: #fff6e2; --card-word-ink: #2b1608; --card-blank: #8a7360; --card-blank-ink: #ffffff; --card-edge: #2b1608;
  --side-bid: #ec6a4f; --side-bid-ink: #2b1608;
  --select-ring: #2b1608;
}

/* ---------------- Editorial Paper ---------------- */
.theme-paper {
  --page-bg: #f1ede4;
  --color-bg: #f1ede4; --color-surface: #faf8f3; --color-surface-strong: #ffffff; --color-border: #161616;
  --color-text: #161616; --color-text-muted: #55524c; --color-label: #161616; --color-gold: #c2330f; --color-focus: #c2330f;
  --cta-bg: #161616; --cta-text: #faf8f3;
  --control-bg: transparent; --control-on-bg: #161616; --control-on-text: #faf8f3;
  --shadow-card: none; --shadow-outline: 0 0 0 0 transparent;
  --radius-card: 0px; --radius-control: 0px; --radius-tile: 0px; --radius-key: 0px;
  --font-display: 'Instrument Serif', Georgia, serif; --display-weight: 400; --display-style: italic; --display-tracking: -0.01em; --display-transform: none;
  --font-body: 'Instrument Sans', system-ui, sans-serif; --body-weight-strong: 700;
  --font-num: 'Instrument Serif', Georgia, serif; --num-weight: 400; --num-style: italic;
  --font-label: 'DM Mono', ui-monospace, monospace; --label-weight: 500; --label-tracking: .14em;
  --positive: #1f6a44; --negative: #b3261e;
  /* NEW */
  --brand-seat: #161616; --brand-seat-active: #c2330f;
  --table-felt: #245a46; --table-felt-2: #1a4234; --table-rim: #f1ede4;
  --seat-ring: #161616; --seat-active: #c2330f;
  --badge-soon-bg: transparent; --badge-soon-text: #161616; --badge-soon-border: #161616;
  --status-offline-bg: #161616; --status-offline-text: #faf8f3; --status-live: #1f6a44;
  --scrim: rgba(22,22,22,.45); --sheet-bg: #faf8f3;
  --team-moon: #3f4bc4; --team-moon-ink: #ffffff;
  --card-word: #ffffff; --card-word-ink: #161616; --card-blank: #77736b; --card-blank-ink: #ffffff; --card-edge: #161616;
  --side-bid: #161616; --side-bid-ink: #faf8f3;
  --select-ring: #c2330f;
}

/* ---------------- base ---------------- */
html, body { margin: 0; }
body { -webkit-font-smoothing: antialiased; }
.screen { position: relative; overflow: hidden; background: var(--page-bg); color: var(--color-text); font-family: var(--font-body); font-size: var(--text-md); line-height: 1.35; }
.screen *, .screen *::before, .screen *::after { box-sizing: border-box; }
.screen p, .screen h1, .screen h2, .screen h3, .screen ul { margin: 0; }
.display { font-family: var(--font-display); font-weight: var(--display-weight); font-style: var(--display-style); letter-spacing: var(--display-tracking); text-transform: var(--display-transform); line-height: 1.02; }
.num { font-family: var(--font-num); font-weight: var(--num-weight); font-style: var(--num-style); font-variant-numeric: tabular-nums; }
.label { font-family: var(--font-label); font-weight: var(--label-weight); letter-spacing: var(--label-tracking); text-transform: uppercase; font-size: var(--text-xs); color: var(--color-label); line-height: 1.2; }
.muted { color: var(--color-text-muted); }
.strong { font-weight: var(--body-weight-strong); }
.card { background: var(--color-surface); border: var(--border-w) solid var(--color-border); border-radius: var(--radius-card); box-shadow: var(--shadow-outline), var(--shadow-card); backdrop-filter: blur(16px); color: var(--color-text); text-decoration: none; }
.theme-emerald .card, .theme-yerba .card, .theme-paper .card { backdrop-filter: none; }
.btn { min-height: var(--tap-min); min-width: var(--tap-min); padding: 0 20px; border-radius: var(--radius-control); border: var(--border-w) solid var(--color-border); background: var(--control-bg); color: var(--color-text); font: 600 var(--text-md)/1 var(--font-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none; box-shadow: var(--shadow-outline); white-space: nowrap; }
.btn-primary { background: var(--cta-bg); color: var(--cta-text); border-color: transparent; font-weight: 700; }
.theme-yerba .btn-primary, .theme-paper .btn-primary { border-color: var(--color-border); }
.theme-yerba .btn-primary { box-shadow: var(--shadow-outline), 3px 3px 0 #2b1608; }
.btn-ghost { border-color: transparent; background: transparent; box-shadow: none; }
.btn-icon { padding: 0; width: var(--tap-min); }
.btn[disabled], .btn.is-disabled { opacity: .45; }
.btn:focus-visible, a:focus-visible, .focus-ring { outline: 3px solid var(--color-focus); outline-offset: 3px; }
.chip { min-height: 32px; padding: 0 12px; border-radius: var(--radius-control); border: var(--border-w) solid var(--color-border); font-size: var(--text-sm); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: var(--color-text-muted); white-space: nowrap; }
.badge-soon { min-height: 32px; padding: 0 12px; border-radius: var(--radius-control); border: var(--border-w) dashed var(--badge-soon-border); background: var(--badge-soon-bg); color: var(--badge-soon-text); font: var(--label-weight) var(--text-xs)/1 var(--font-label); letter-spacing: var(--label-tracking); text-transform: uppercase; display: inline-flex; align-items: center; white-space: nowrap; }
.offline { background: var(--status-offline-bg); color: var(--status-offline-text); border-radius: var(--radius-control); display: inline-flex; align-items: center; gap: 8px; min-height: 32px; padding: 0 12px; font-size: var(--text-sm); font-weight: 700; }
.seg { display: grid; border: var(--border-w) solid var(--color-border); border-radius: var(--radius-control); padding: 3px; gap: 3px; background: var(--control-bg); box-shadow: var(--shadow-outline); }
.seg > * { min-height: 44px; border-radius: var(--radius-control); display: flex; align-items: center; justify-content: center; gap: 6px; font: 600 var(--text-sm)/1 var(--font-body); color: var(--color-text-muted); border: 0; background: transparent; }
.seg > .on { background: var(--control-on-bg); color: var(--control-on-text); }
.switch { width: 52px; height: 32px; border-radius: 99px; background: var(--control-on-bg); position: relative; flex: none; border: var(--border-w) solid var(--color-border); }
.switch::after { content: ''; position: absolute; top: 3px; left: 23px; width: 24px; height: 24px; border-radius: 99px; background: var(--control-on-text); }
.switch.off { background: var(--control-bg); }
.switch.off::after { left: 3px; background: var(--color-text-muted); }
.row { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.divider { border-top: var(--border-w) solid var(--color-border); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--sheet-bg); border-top: var(--border-w) solid var(--color-border); border-radius: 28px 28px 0 0; padding: 10px 20px 24px; box-shadow: var(--shadow-outline); }
.theme-paper .sheet { border-radius: 0; }
.handle { width: 44px; height: 5px; border-radius: 9px; background: var(--color-border); margin: 0 auto 6px; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.fade-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: linear-gradient(180deg, transparent, var(--color-bg)); pointer-events: none; }
.avatar { width: 48px; height: 48px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 26px; flex: none; line-height: 1; }
.art { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-tile); overflow: hidden; }
.art > svg { display: block; width: 100%; height: 100%; }
.soon-art { filter: saturate(.35); opacity: .75; }
.pill-dot { width: 8px; height: 8px; border-radius: 99px; background: var(--status-live); flex: none; }

/* in-game table */
.felt { background: radial-gradient(70% 70% at 40% 30%, var(--table-felt), var(--table-felt-2)); border: 3px solid var(--table-rim); border-radius: 50%; box-shadow: var(--shadow-outline), inset 0 -10px 30px rgba(0,0,0,.25); }
.theme-yerba .felt { box-shadow: 0 0 0 2px #2b1608, 5px 6px 0 #2b1608; }
.seat { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 92px; transform: translate(-50%, -50%); }
.seat .avatar { box-shadow: 0 0 0 3px var(--seat-ring); }
.seat-name { font-weight: 700; font-size: var(--text-sm); text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.theme-yerba .seat-name, .theme-paper .seat-name { text-shadow: none; }
.badge { min-height: 26px; padding: 0 10px; border-radius: 99px; background: var(--control-on-bg); color: var(--control-on-text); font: 700 var(--text-xs)/26px var(--font-body); letter-spacing: .06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.badge-bid { background: var(--side-bid); color: var(--side-bid-ink); }
.passed .avatar { opacity: .4; filter: grayscale(1); }
.passed .seat-name { opacity: .6; }

/* Ishaara word cards */
.wcard { border-radius: var(--radius-key); border: 2px solid var(--card-edge); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; font: 800 var(--text-sm)/1.05 var(--font-body); letter-spacing: .02em; text-transform: uppercase; position: relative; overflow: hidden; padding: 4px; }
.w-word { background: var(--card-word); color: var(--card-word-ink); }
.w-sun { background: var(--team-sun); color: var(--team-sun-ink); }
.w-moon { background: var(--team-moon); color: var(--team-moon-ink); }
.w-blank { background: repeating-linear-gradient(135deg, rgba(255,255,255,.16) 0 6px, rgba(255,255,255,0) 6px 14px), var(--card-blank); color: var(--card-blank-ink); }
.w-trap { background: repeating-linear-gradient(45deg, rgba(255,255,255,.13) 0 4px, rgba(255,255,255,0) 4px 12px), var(--card-trap); color: var(--card-trap-ink); }
.w-selected { box-shadow: 0 0 0 4px var(--select-ring), 0 10px 24px rgba(0,0,0,.35); transform: translateY(-3px); }
.w-done { opacity: .9; }
.team-pill { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: 99px; font-weight: 800; font-size: var(--text-md); }
.t-sun { background: var(--team-sun); color: var(--team-sun-ink); }
.t-moon { background: var(--team-moon); color: var(--team-moon-ink); }

/* clue-giver phone: plain and dark in every theme */
.clue { background: var(--clue-bg); color: var(--clue-text); font-family: 'Instrument Sans', system-ui, sans-serif; }
.clue .card { background: var(--clue-surface); border-color: var(--clue-border); color: var(--clue-text); box-shadow: none; border-radius: 16px; backdrop-filter: none; }
.clue .muted { color: var(--clue-muted); }
.clue .btn { background: var(--clue-surface); color: var(--clue-text); border-color: var(--clue-border); border-radius: 14px; box-shadow: none; font-family: 'Instrument Sans', sans-serif; }
.clue .btn-primary { background: #e9e6e1; color: #0e0e10; border-color: transparent; }
.clue .label { color: var(--clue-muted); font-family: 'Instrument Sans', sans-serif; letter-spacing: .14em; }
.clue .wcard { border-radius: 10px; border-color: transparent; }

/* NEW · deck colours (card faces, backs, suit pips in the UI) */
.theme-sunset  { --deck-face: #fbf3ec; --deck-ink: #1d1418; --deck-red: #c0263f; --deck-rule: #e2a3b8; --deck-back: #9a3466; --suit-red: #ff8fb0; }
.theme-emerald { --deck-face: #f6efe3; --deck-ink: #1a1a12; --deck-red: #a8202e; --deck-rule: #b8862f; --deck-back: #1d5a40; --suit-red: #ff9a8a; }
.theme-yerba   { --deck-face: #fff6e2; --deck-ink: #2b1608; --deck-red: #c8462c; --deck-rule: #2b1608; --deck-back: #ec6a4f; --suit-red: #c8462c; }
.theme-paper   { --deck-face: #ffffff; --deck-ink: #161616; --deck-red: #c2330f; --deck-rule: #161616; --deck-back: #1d1d1d; --suit-red: #c2330f; }

html,body{width:390px;height:844px;overflow:hidden;background:#000}
.theme-sunset{--suit-red:#ff8fb0}.theme-emerald{--suit-red:#ff9a8a}.theme-yerba{--suit-red:#c8462c}.theme-paper{--suit-red:#c2330f}
.clue{background:var(--clue-bg)}.k{border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:800 11px/1.05 'Instrument Sans',sans-serif;text-transform:uppercase;letter-spacing:.02em}
.k-s{background:#3a2604;color:#f5c46a}.k-m{background:#1b1f4f;color:#bcc2ff}.k-b{background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 5px,transparent 5px 12px),#25252a;color:#a19d97}.k-t{background:#000;color:#ff9a8a;box-shadow:inset 0 0 0 1.5px #ff9a8a}.k-done{opacity:.32}</style></head>
<body><div class="screen theme-sunset clue" style="width:390px;height:844px"><div style="height:844px;padding:16px 18px 24px;display:flex;flex-direction:column;gap:20px">
