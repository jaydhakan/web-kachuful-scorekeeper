/* ===== Demo chrome ===== */
*{box-sizing:border-box}
html{--f1:11px;--f2:12px;--f3:13px;--f4:15px;--f5:17px;--f6:20px;--f7:28px;--f8:36px;--bar:56px}
body{margin:0;background:var(--surface-1);color:var(--text-1);font-family:var(--font-body);font-size:var(--f4);line-height:1.35;-webkit-text-size-adjust:100%}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* control bar */
#bar{position:fixed;inset:0 0 auto 0;height:var(--bar);z-index:60;display:flex;align-items:center;gap:8px;padding:6px 12px;overflow-x:auto;background:var(--surface-2);border-bottom:var(--bw) solid var(--bd);scrollbar-width:thin}
#bar>*{flex:none}
.cb{min-height:44px;min-width:44px;padding:0 12px;border-radius:var(--r-md);border:var(--bw) solid var(--hairline-2);background:var(--surface-3);color:var(--text-1);font-size:var(--f3);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.cb[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--bd)}
.cb.scene{max-width:230px;overflow:hidden;text-overflow:ellipsis;background:var(--brand);color:var(--on-brand)}
#bar select{min-height:44px;border-radius:var(--r-md);border:var(--bw) solid var(--hairline-2);background:var(--surface-3);padding:0 8px;font-size:var(--f3);font-weight:600;color:var(--text-1)}
.grp{display:flex;border:var(--bw) solid var(--hairline-2);border-radius:var(--r-md);overflow:hidden;background:var(--surface-3)}
.grp button{min-height:44px;min-width:44px;padding:0 10px;font-size:var(--f3);font-weight:600;color:var(--text-2)}
.grp button[aria-pressed=true]{background:var(--brand);color:var(--on-brand)}
.lbl{font-size:var(--f1);letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-family:var(--font-mono)}

/* page and phone frame */
#page{min-height:100dvh;padding:calc(var(--bar) + 12px) 12px 12px;display:flex;justify-content:center;align-items:flex-start}
#frame{position:relative;width:390px;height:min(844px,calc(100dvh - var(--bar) - 24px));min-height:560px;overflow:hidden;border-radius:36px;border:6px solid var(--text-1);background:var(--bg);background-image:var(--ambient);display:flex;flex-direction:column;isolation:isolate}
html[data-theme=yerba-sun] #frame,html[data-theme=editorial-paper] #frame{border-color:var(--ink)}
@media (max-width:430px){
  #page{padding:var(--bar) 0 0}
  #frame{width:100%;height:calc(100dvh - var(--bar));min-height:0;border-radius:0;border:0}
}
#top{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px 6px}
#top h1{margin:0;font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:var(--display-track);font-size:var(--f5);line-height:1.15;flex:1;min-width:0}
.tag{font-size:var(--f1);letter-spacing:.06em;text-transform:uppercase;font-family:var(--font-mono);padding:3px 7px;border-radius:99px;border:1px dashed var(--hairline-2);color:var(--text-3);white-space:nowrap}
#scene{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
#scene>section{display:flex;flex-direction:column;gap:14px}
/* decision bar */
#decide{flex:none;padding:8px 12px 10px;border-top:var(--bw) solid var(--hairline-2);background:var(--surface-1);display:flex;flex-direction:column;gap:6px}
#decide .row{display:flex;gap:8px;align-items:stretch}
.seg{display:flex;flex:1;border:var(--bw) solid var(--hairline-2);border-radius:var(--r-md);overflow:hidden;background:var(--surface-2)}
.seg button{flex:1;min-height:44px;min-width:44px;font-size:var(--f3);font-weight:700;color:var(--text-2)}
.seg button+button{border-left:var(--bw) solid var(--hairline-2)}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--on-brand)}
.seg button[data-v=cut][aria-pressed=true]{background:var(--danger);color:var(--on-danger)}
.seg button[data-v=keep][aria-pressed=true]{background:var(--success);color:var(--on-success)}
#decide input{flex:1;min-height:44px;border-radius:var(--r-md);border:var(--bw) solid var(--hairline-2);background:var(--surface-2);padding:0 12px;font-size:var(--f3);width:100%}

/* generic */
.card{background:var(--card-bg2);border:var(--bw) solid var(--bd);border-radius:var(--r-lg);box-shadow:var(--sh);padding:12px}
.card h2,.sec h2{margin:0 0 6px;font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:var(--display-track);font-size:var(--f5)}
.sec>h2{font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:var(--display-track);font-size:var(--f5);margin:0 0 6px}
.note{font-size:var(--f3);color:var(--text-2);margin:0}
.fine{font-size:var(--f2);color:var(--text-3);margin:0}
